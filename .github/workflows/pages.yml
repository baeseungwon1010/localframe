name: Deploy web version

on:
  push:
    branches: [main]
  # Run by hand from the Actions tab to build on another Ubuntu version.
  workflow_dispatch:
    inputs:
      runner:
        description: Ubuntu version to build on
        type: choice
        options: [ubuntu-24.04, ubuntu-22.04, ubuntu-latest]
        default: ubuntu-24.04

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # pinned to match local development (Ubuntu 24.04); pushes always use it
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:web
        env:
          # served under /<repo>/ on github.io; with a custom domain set the repository variables
          # PAGES_BASE to / and SITE_URL to https://your.domain/ (see README, "Custom domain")
          LOCALFRAME_BASE: ${{ vars.PAGES_BASE || format('/{0}/', github.event.repository.name) }}
          # absolute address for link previews (og:image and og:url)
          LOCALFRAME_SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
